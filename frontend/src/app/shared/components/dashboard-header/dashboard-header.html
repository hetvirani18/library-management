<header class="border-b border-border bg-nav backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="flex items-center gap-2 font-serif text-xl font-semibold tracking-tight">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="text-primary">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Ledger &amp; Leaf
    </a>
    <div class="flex items-center gap-4">
      @if (auth.currentUser(); as user) {
        <div class="hidden text-right sm:block">
          <div class="text-sm font-medium leading-tight">{{ user.fullName }}</div>
          <div class="text-xs leading-tight text-muted-foreground">{{ user.role }}</div>
        </div>
      }
      <app-theme-toggle />
      <button
        type="button"
        (click)="logout()"
        class="rounded-lg border border-border px-4 py-2 text-sm font-medium transition-colors hover:bg-muted"
      >
        Log out
      </button>
    </div>
  </div>
</header>
